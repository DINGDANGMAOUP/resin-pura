# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Create a draft release.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
jobs:

  # Prepare shared metadata for downstream jobs
  metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
      pluginVerifierHomeDir: ${{ steps.properties.outputs.pluginVerifierHomeDir }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Build Toolchain
        uses: ./.github/actions/setup-gradle-java

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(awk -F '=' '/^pluginVersion[[:space:]]*=/{print $2; exit}' gradle.properties | xargs)"
          if [ -z "$VERSION" ]; then
            echo "Failed to read pluginVersion from gradle.properties"
            exit 1
          fi
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pluginVerifierHomeDir=$HOME/.pluginVerifier" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # Run Gradle quality/build tasks in parallel
  gradleChecks:
    name: ${{ matrix.name }}
    needs: [ metadata ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build plugin
            task: buildPlugin
            arguments: ""
          - name: Run tests
            task: check
            arguments: ""
          - name: Run tests on compatibility floor
            task: test
            arguments: "-PplatformVersion=2024.2"
          - name: Verify plugin
            task: verifyPlugin
            arguments: ""
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
      - name: Setup Build Toolchain
        uses: ./.github/actions/setup-gradle-java
      - name: Maximize Build Space
        if: ${{ matrix.task == 'verifyPlugin' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - name: Setup Plugin Verifier IDEs Cache
        if: ${{ matrix.task == 'verifyPlugin' }}
        uses: actions/cache@v4
        with:
          path: ${{ needs.metadata.outputs.pluginVerifierHomeDir }}/ides
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Run Gradle Task
        run: |
          if [ "${{ matrix.task }}" = "verifyPlugin" ]; then
            ./gradlew verifyPlugin -Dplugin.verifier.home.dir=${{ needs.metadata.outputs.pluginVerifierHomeDir }} ${{ matrix.arguments }}
          else
            ./gradlew ${{ matrix.task }} ${{ matrix.arguments }}
          fi
      - name: Collect Tests Result
        if: ${{ failure() && (matrix.task == 'check' || matrix.task == 'test') }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-result-${{ matrix.name }}
          path: ${{ github.workspace }}/build/reports/tests
      - name: Upload Code Coverage Report
        if: ${{ matrix.task == 'check' }}
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/build/reports/kover/report.xml
      - name: Prepare Plugin Artifact
        if: ${{ matrix.task == 'buildPlugin' }}
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          shopt -s nullglob
          artifacts=(*.zip)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin ZIP, found ${#artifacts[@]}"
            exit 1
          fi
          FILENAME="${artifacts[0]}"
          unzip "$FILENAME" -d content
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"
      - name: Upload Built Plugin
        if: ${{ matrix.task == 'buildPlugin' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*
      - name: Collect Plugin Verifier Result
        if: ${{ always() && matrix.task == 'verifyPlugin' }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, release workflow would be triggered
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ metadata, gradleChecks ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.metadata.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "v${{ needs.metadata.outputs.version }}" \
            --draft \
            --title "v${{ needs.metadata.outputs.version }}" \
            --notes-file release-notes.md
