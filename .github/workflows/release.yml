# GitHub Actions Workflow for creating releases when tags are pushed.
# This workflow builds the plugin and uploads the artifact to GitHub releases.

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Build Toolchain
        uses: ./.github/actions/setup-gradle-java
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CHANGELOG_VERSION="${VERSION#v}"
          PLUGIN_VERSION="$(awk -F '=' '/^pluginVersion[[:space:]]*=/{print $2; exit}' gradle.properties | xargs)"
          if [ -z "$PLUGIN_VERSION" ]; then
            echo "Failed to read pluginVersion from gradle.properties"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version ($CHANGELOG_VERSION) does not match pluginVersion ($PLUGIN_VERSION)"
            exit 1
          fi
          if CHANGELOG="$(./gradlew getChangelog --no-header --console=plain -q --project-version="$CHANGELOG_VERSION")"; then
            echo "Using changelog section for version $CHANGELOG_VERSION"
          else
            echo "Version $CHANGELOG_VERSION is missing in CHANGELOG.md, trying Unreleased section"
            UNRELEASED="$(./gradlew getChangelog --unreleased --no-header --console=plain -q || true)"
            if [ -n "$(echo "$UNRELEASED" | tr -d '[:space:]')" ]; then
              CHANGELOG="$UNRELEASED"
              echo "Using Unreleased changelog section"
            else
              echo "Unreleased section is empty, generating changelog from git commits"
              PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$VERSION" | head -n1 || true)"
              if [ -n "$PREVIOUS_TAG" ]; then
                COMMITS="$(git log --pretty='- %s' "$PREVIOUS_TAG..$VERSION")"
              else
                COMMITS="$(git log --pretty='- %s' -n 30)"
              fi
              if [ -z "$(echo "$COMMITS" | tr -d '[:space:]')" ]; then
                COMMITS="- Release $VERSION"
              fi
              CHANGELOG="$(printf '### Changed\n%s\n' "$COMMITS")"
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: Verify and build release artifact
    needs: [ metadata ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
      - name: Setup Build Toolchain
        uses: ./.github/actions/setup-gradle-java
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - name: Test compatibility floor
        run: ./gradlew test -PplatformVersion=2024.2
      - name: Verify and Build Plugin
        run: ./gradlew check buildPlugin verifyPlugin
      - name: Create artifact checksum
        shell: bash
        run: |
          cd build/distributions
          shopt -s nullglob
          artifacts=(*.zip)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin ZIP, found ${#artifacts[@]}"
            exit 1
          fi
          release_artifact="${artifacts[0]// /.}"
          if [ "$release_artifact" != "${artifacts[0]}" ]; then
            mv -- "${artifacts[0]}" "$release_artifact"
          fi
          sha256sum "$release_artifact" > SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-plugin-zip
          path: |
            ./build/distributions/*.zip
            ./build/distributions/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [ metadata, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-plugin-zip
          path: ./release-artifacts
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.metadata.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "${{ needs.metadata.outputs.version }}" \
            -R "${{ github.repository }}" \
            --title "${{ needs.metadata.outputs.version }}" \
            --notes-file release-notes.md \
            ./release-artifacts/*.zip \
            ./release-artifacts/SHA256SUMS
