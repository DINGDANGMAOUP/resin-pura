# GitHub Actions Workflow for creating releases when tags are pushed.
# This workflow builds the plugin and uploads the artifact to GitHub releases.

name: Release
on:
  push:
    tags:
      - 'v*'

jobs:

  # Build and upload the plugin to GitHub releases
  release:
    name: Release Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Build the plugin
      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Create release and upload artifact
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.properties.outputs.version }}" \
            --title "${{ steps.properties.outputs.version }}" \
            --notes "${{ steps.properties.outputs.changelog }}" \
            ./build/distributions/*.zip
