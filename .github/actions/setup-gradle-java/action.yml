name: Setup Gradle Java
description: Setup Java 21, Gradle cache, and executable Gradle wrapper

inputs:
  java-distribution:
    description: Java distribution for setup-java
    required: false
    default: zulu
  java-version:
    description: Java version for setup-java
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
